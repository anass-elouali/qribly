name: qribly-prod

services:

  backend:
    image: qribly-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    restart: unless-stopped

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "8000"


  frontend:
    image: qribly-frontend:prod
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend
      - reverb


  postgres:
    image: postgis/postgis:16-3.4

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  reverb:
    image: qribly-backend:prod

    restart: unless-stopped

    command: php artisan reverb:start --host=0.0.0.0 --port=8080

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}

      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      disable: true

    expose:
      - "8080"


  queue:
    image: qribly-backend:prod

    restart: unless-stopped

    command: php artisan queue:work --tries=3 --timeout=90

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      disable: true


volumes:
  postgres_data:
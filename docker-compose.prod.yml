name: qribly-prod

services:

  backend:
    image: qribly-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    restart: unless-stopped

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

    volumes:
      - app_data:/var/www/html

    depends_on:
      postgres:
        condition: service_healthy


  nginx:
    image: qribly-nginx:prod
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - app_data:/var/www/html:ro

    depends_on:
      - backend


  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  app_data:
  postgres_data:
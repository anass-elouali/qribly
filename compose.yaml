services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: qribly-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: qribly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qribly

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qribly"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: qribly-backend

    working_dir: /var/www

    volumes:
      - ./backend:/var/www

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    command: >
      sh -c "
        php artisan migrate --force &&
        php artisan serve --host=0.0.0.0 --port=8000
      "

volumes:
  postgres_data: